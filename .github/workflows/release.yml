name: Release

on:
  push:
    tags:
      - 'v*.*'  # Triggers on version tags like v1.0, v1.1, v2.0, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for changelog generation
        
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Run tests
      env:
        API_TOKEN: test-token-for-ci
        MODEM_URL: http://192.168.8.1
        MODEM_USERNAME: admin
        MODEM_PASSWORD: test-password
        POLL_SECONDS: 0
        WEBHOOK_URL: http://test-webhook.local/webhook
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest
        
    - name: Generate changelog
      id: changelog
      run: |
        # Extract changes since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -z "$LAST_TAG" ]; then
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%h)" --no-merges >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: ${LAST_TAG}...v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release v${{ steps.version.outputs.version }}
        body: |
          ## Release v${{ steps.version.outputs.version }}
          
          ${{ steps.changelog.outputs.changelog }}
          
          ## Docker Image
          
          ```bash
          docker pull ghcr.io/${{ github.repository_owner }}/sms-gateway:v${{ steps.version.outputs.version }}
          ```
          
          Or use the `latest` tag:
          
          ```bash
          docker pull ghcr.io/${{ github.repository_owner }}/sms-gateway:latest
          ```
        draft: false
        prerelease: false
        generate_release_notes: true
